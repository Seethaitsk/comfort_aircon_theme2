<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="casBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="casShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b3d91" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="#f8fafc"/>
  <!-- Commercial AC Badge -->
  <g transform="translate(25, 20)">
    <rect width="135" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="67" y="17" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">COMMERCIAL CASSETTE</text>
  </g>
  <!-- Cassette Panel Drawing -->
  <g filter="url(#casShadow)" transform="translate(100, 50)">
    <!-- Outer Square Ceiling Fascia -->
    <rect width="200" height="150" rx="8" fill="url(#casBg)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- 4 Air Outlets (Perimeter Louvers) -->
    <!-- Top Louver -->
    <rect x="25" y="12" width="150" height="14" rx="3" fill="#94a3b8"/>
    <!-- Bottom Louver -->
    <rect x="25" y="124" width="150" height="14" rx="3" fill="#94a3b8"/>
    <!-- Left Louver -->
    <rect x="12" y="32" width="14" height="86" rx="3" fill="#94a3b8"/>
    <!-- Right Louver -->
    <rect x="174" y="32" width="14" height="86" rx="3" fill="#94a3b8"/>
    <!-- Center Intake Grille -->
    <rect x="36" y="36" width="128" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <g stroke="#cbd5e1" stroke-width="1.5">
      <line x1="42" y1="50" x2="158" y2="50"/>
      <line x1="42" y1="62" x2="158" y2="62"/>
      <line x1="42" y1="74" x2="158" y2="74"/>
      <line x1="42" y1="86" x2="158" y2="86"/>
      <line x1="42" y1="98" x2="158" y2="98"/>
    </g>
    <!-- Brand on center plate -->
    <rect x="75" y="65" width="50" height="20" rx="3" fill="#0b3d91"/>
    <text x="100" y="79" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">Carrier</text>
    <!-- Sensor LED -->
    <circle cx="180" cy="20" r="3" fill="#16a9d9"/>
  </g>
  <!-- 360 Degree airflow indicators -->
  <g stroke="#16a9d9" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M200 40v-15"/>
    <path d="M200 210v15"/>
    <path d="M90 125H75"/>
    <path d="M310 125h15"/>
  </g>
  <text x="200" y="235" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Carrier C-Series • 360° Ceiling Cassette</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="p2Shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b3d91" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="#f0fdf4"/>
  <!-- 5 Star Badge -->
  <g transform="translate(25, 20)">
    <rect width="96" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/>
    <text x="48" y="17" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★★★★★ 5 STAR</text>
  </g>
  <!-- Carrier Split Unit - Premium Gold/Cyan Accent -->
  <g filter="url(#p2Shadow)" transform="translate(40, 70)">
    <rect width="320" height="95" rx="12" fill="url(#p2Grad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="15" y1="12" x2="305" y2="12" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="15" y1="18" x2="305" y2="18" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Gold / Chrome Strip -->
    <line x1="0" y1="72" x2="320" y2="72" stroke="#eab308" stroke-width="2.5"/>
    <rect x="15" y="76" width="290" height="14" rx="3" fill="#94a3b8"/>
    <!-- Brand -->
    <rect x="25" y="38" width="55" height="18" rx="3" fill="#0b3d91"/>
    <text x="52" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">Carrier</text>
    <!-- Temperature Display -->
    <rect x="235" y="35" width="60" height="25" rx="5" fill="#f8fafc"/>
    <text x="265" y="52" fill="#15803d" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">22°C</text>
    <circle cx="308" cy="48" r="2.5" fill="#15803d"/>
  </g>
  <!-- Breeze Streams -->
  <path d="M90 185c30 18 60 18 90 0m30 0c30 18 60 18 90 0" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <text x="200" y="225" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Carrier Emperia Neo • 5 Star Super Inverter</text>
</svg>

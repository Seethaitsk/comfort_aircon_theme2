<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="p3Shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b3d91" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="#f8fafc"/>
  <!-- 2.0 Ton Heavy Duty Tag -->
  <g transform="translate(25, 20)">
    <rect width="115" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="57" y="17" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2.0 TON HEAVY DUTY</text>
  </g>
  <!-- Unit Shell (Wider stance) -->
  <g filter="url(#p3Shadow)" transform="translate(30, 70)">
    <rect width="340" height="98" rx="10" fill="url(#p3Grad)" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="15" y1="12" x2="325" y2="12" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="15" y1="18" x2="325" y2="18" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="0" y1="74" x2="340" y2="74" stroke="#0284c7" stroke-width="3"/>
    <rect x="15" y="78" width="310" height="15" rx="3" fill="#64748b"/>
    <!-- Brand -->
    <rect x="25" y="40" width="55" height="18" rx="3" fill="#0b3d91"/>
    <text x="52" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">Carrier</text>
    <!-- Temperature -->
    <rect x="250" y="36" width="65" height="26" rx="5" fill="#e2e8f0"/>
    <text x="282" y="54" fill="#0369a1" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">18°C</text>
    <circle cx="325" cy="49" r="2.5" fill="#38bdf8"/>
  </g>
  <path d="M80 185c35 15 70 15 105 0m35 0c35 15 70 15 105 0" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <text x="200" y="225" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Carrier Durafresh • High Airflow Inverter</text>
</svg>

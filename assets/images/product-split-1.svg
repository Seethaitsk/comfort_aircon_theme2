<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b3d91" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="#f8fafc"/>
  <!-- Energy Badge -->
  <g transform="translate(25, 20)">
    <rect width="90" height="26" rx="13" fill="#fef3c7" stroke="#fde68a"/>
    <text x="45" y="17" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★★★☆☆ 3 STAR</text>
  </g>
  <!-- Carrier Split Unit -->
  <g filter="url(#pShadow)" transform="translate(40, 70)">
    <rect width="320" height="95" rx="10" fill="url(#p1Grad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="15" y1="12" x2="305" y2="12" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="15" y1="18" x2="305" y2="18" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="0" y1="72" x2="320" y2="72" stroke="#16a9d9" stroke-width="2.5"/>
    <rect x="15" y="76" x2="305" width="290" height="14" rx="3" fill="#cbd5e1"/>
    <!-- Brand -->
    <rect x="25" y="38" width="55" height="18" rx="3" fill="#0b3d91"/>
    <text x="52" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">Carrier</text>
    <!-- Temperature -->
    <rect x="235" y="35" width="60" height="25" rx="5" fill="#f1f5f9"/>
    <text x="265" y="52" fill="#0284c7" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">24°C</text>
    <circle cx="308" cy="48" r="2.5" fill="#22c55e"/>
  </g>
  <!-- Subtle breeze lines below -->
  <path d="M100 185c20 15 50 15 70 0m40 0c20 15 50 15 70 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Subtitle tag -->
  <text x="200" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Carrier Ester Neo • 1.5 Ton Inverter</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a9d9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b3d91" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="160" cy="120" r="95" fill="url(#mGrad)"/>
  
  <!-- Outer Rotating Gear (Maintenance motif) -->
  <g stroke="#0b3d91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.25">
    <circle cx="160" cy="120" r="75" stroke-dasharray="10 14"/>
  </g>

  <!-- AC Miniature -->
  <g transform="translate(70, 75)">
    <rect width="180" height="60" rx="8" fill="#ffffff" stroke="#0b3d91" stroke-width="2.5"/>
    <line x1="12" y1="46" x2="168" y2="46" stroke="#16a9d9" stroke-width="2"/>
    <rect x="18" y="22" width="38" height="12" rx="2" fill="#0b3d91"/>
    <text x="37" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">Carrier</text>
    <rect x="130" y="20" width="34" height="15" rx="3" fill="#e0f2fe"/>
    <text x="147" y="31" fill="#0284c7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">24°C</text>
  </g>

  <!-- Crossed Tools (Wrench & Screwdriver) in front -->
  <g transform="translate(130, 115)">
    <!-- Circle badge behind tools -->
    <circle cx="30" cy="30" r="32" fill="#0b3d91"/>
    <circle cx="30" cy="30" r="28" fill="#16a9d9"/>
    
    <!-- Wrench -->
    <path d="M20 40l20-20m-3-3l3-3a4.5 4.5 0 016.3 6.3l-3 3" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Screwdriver -->
    <path d="M40 40L20 20m0 0l-4-4a3 3 0 014.2-4.2l4 4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Snowflakes -->
  <g stroke="#16a9d9" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 50v14m-7-7h14m-12-5l10 10m-10 0l10-10"/>
    <path d="M260 170v14m-7-7h14m-12-5l10 10m-10 0l10-10"/>
  </g>
</svg>
